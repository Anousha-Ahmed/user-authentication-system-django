<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);height:100vh;display:flex;justify-content:center;align-items:center;}
        .container{background:white;border-radius:10px;width:100%;max-width:400px;padding:40px;box-shadow:0 10px 25px rgba(0,0,0,0.1);}
        h1{text-align:center;margin-bottom:30px;color:#333;}
        input{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ddd;border-radius:5px;font-size:14px;}
        input:focus{outline:none;border-color:#667eea;}
        button{width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:5px;cursor:pointer;font-size:16px;}
        button:hover{background:#5a67d8;}
        .message{padding:10px;margin-bottom:20px;border-radius:5px;display:none;}
        .message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
        .message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
        .links{text-align:center;margin-top:20px;}
        .links a{color:#667eea;text-decoration:none;}
        .links a:hover{text-decoration:underline;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <div id="message" class="message"></div>
        <form id="loginForm">
            <input type="text" id="userName" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <a href="/api/users/signup-page/">Don't have an account? Sign Up</a><br>
            <a href="/api/users/forgot-password-page/">Forgot Password?</a>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://127.0.0.1:8000';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userName = document.getElementById('userName').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/users/login/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify({userName, password})
                });
                
                const data = await response.json();
                
                if(response.ok) {
                    showMessage('Login successful! Redirecting to dashboard...', 'success');
                    setTimeout(() => {
                        // SAHI URL - Django server ka dashboard
                        window.location.href = `${BACKEND_URL}/api/users/dashboard/`;
                    }, 1500);
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch(error) {
                showMessage('Cannot connect to server', 'error');
            }
        });
        
        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => msgDiv.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
