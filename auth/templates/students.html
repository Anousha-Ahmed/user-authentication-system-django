<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .content {
            padding: 20px;
        }

        .add-student-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .add-student-form h2 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5a67d8;
        }

        .btn-delete {
            background: #e53e3e;
        }

        .btn-delete:hover {
            background: #c53030;
        }

        .btn-edit {
            background: #48bb78;
        }

        .btn-edit:hover {
            background: #38a169;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .students-table th,
        .students-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .students-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        .students-table tr:hover {
            background: #f8f9fa;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 20px;
        }

        .pagination button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #5a67d8;
        }

        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .pagination span {
            font-size: 14px;
            color: #333;
        }

        .page-size-selector {
            margin-left: 20px;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            font-size: 20px;
            margin-bottom: 15px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Management System</h1>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
        
        <div class="content">
            <div id="alert" class="alert"></div>
            
            <div class="add-student-form">
                <h2>Add New Student</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Roll Number:</label>
                        <input type="text" id="roll_no" required>
                    </div>
                    <div class="form-group">
                        <label>Class:</label>
                        <input type="text" id="class_name" required>
                    </div>
                    <div class="form-group">
                        <label>Age:</label>
                        <input type="number" id="age" required>
                    </div>
                    <button type="submit" class="btn">Add Student</button>
                </form>
            </div>
            
            <h2>Student List</h2>
            <div id="loading" class="loading" style="display: none;">Loading...</div>
            <table class="students-table" id="studentsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Class</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsList">
                    <tr>
                        <td colspan="6" style="text-align: center;">No students found</td>
                    </tr>
                </tbody>
            </table>
            
            <div class="pagination">
                <button onclick="loadStudents(1)" id="firstBtn" disabled>First</button>
                <button onclick="loadStudents(currentPage - 1)" id="prevBtn" disabled>Previous</button>
                <span id="pageInfo">Page 1 of 1</span>
                <button onclick="loadStudents(currentPage + 1)" id="nextBtn" disabled>Next</button>
                <button onclick="loadStudents(totalPages)" id="lastBtn" disabled>Last</button>
                <select id="pageSize" class="page-size-selector" onchange="changePageSize()">
                    <option value="5">5 per page</option>
                    <option value="10" selected>10 per page</option>
                    <option value="20">20 per page</option>
                    <option value="50">50 per page</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Student</div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Roll Number:</label>
                    <input type="text" id="editRollNo" required>
                </div>
                <div class="form-group">
                    <label>Class:</label>
                    <input type="text" id="editClass" required>
                </div>
                <div class="form-group">
                    <label>Age:</label>
                    <input type="number" id="editAge" required>
                </div>
                <button type="submit" class="btn">Update Student</button>
                <button type="button" class="btn" onclick="closeModal()" style="background: #ccc;">Cancel</button>
            </form>
        </div>
    </div>
    
    <script>
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 10;
        
        // Check authentication
        async function checkAuth() {
            try {
                const response = await fetch('/api/users/check-session/');
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/api/users/login-page/';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/api/users/login-page/';
            }
        }
        
        // Load students with pagination
        async function loadStudents(page = 1) {
            currentPage = page;
            const loadingDiv = document.getElementById('loading');
            loadingDiv.style.display = 'block';
            
            try {
                const response = await fetch(`/api/users/students/?page=${page}&page_size=${pageSize}`);
                const data = await response.json();
                
                totalPages = data.total_pages;
                currentPage = data.current_page;
                
                // Update pagination buttons
                document.getElementById('firstBtn').disabled = currentPage === 1;
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage === totalPages;
                document.getElementById('lastBtn').disabled = currentPage === totalPages;
                document.getElementById('pageInfo').innerText = `Page ${currentPage} of ${totalPages}`;
                
                // Display students
                displayStudents(data.results);
            } catch (error) {
                console.error('Error loading students:', error);
                showAlert('Error loading students', 'error');
            } finally {
                loadingDiv.style.display = 'none';
            }
        }
        
        // Display students in table
        function displayStudents(students) {
            const tbody = document.getElementById('studentsList');
            
            if (!students || students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No students found</td></tr>';
                return;
            }
            
            tbody.innerHTML = students.map(student => `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.roll_no}</td>
                    <td>${student.class_name}</td>
                    <td>${student.age}</td>
                    <td class="action-buttons">
                        <button class="btn btn-edit" onclick="editStudent(${student.id})">Edit</button>
                        <button class="btn btn-delete" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // Change page size
        async function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            await loadStudents(1);
        }
        
        // Add new student
        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const studentData = {
                name: document.getElementById('name').value,
                roll_no: document.getElementById('roll_no').value,
                class_name: document.getElementById('class_name').value,
                age: parseInt(document.getElementById('age').value)
            };
            
            try {
                const response = await fetch('/api/users/students/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(studentData)
                });
                
                if (response.ok) {
                    showAlert('Student added successfully!', 'success');
                    document.getElementById('studentForm').reset();
                    await loadStudents(currentPage);
                } else {
                    const error = await response.json();
                    showAlert(JSON.stringify(error), 'error');
                }
            } catch (error) {
                console.error('Error adding student:', error);
                showAlert('Error adding student', 'error');
            }
        });
        
        // Edit student
        async function editStudent(id) {
            try {
                const response = await fetch(`/api/users/students/${id}/`);
                const student = await response.json();
                
                document.getElementById('editId').value = student.id;
                document.getElementById('editName').value = student.name;
                document.getElementById('editRollNo').value = student.roll_no;
                document.getElementById('editClass').value = student.class_name;
                document.getElementById('editAge').value = student.age;
                
                document.getElementById('editModal').style.display = 'flex';
            } catch (error) {
                console.error('Error fetching student:', error);
                showAlert('Error fetching student details', 'error');
            }
        }
        
        // Update student
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('editId').value;
            const studentData = {
                name: document.getElementById('editName').value,
                roll_no: document.getElementById('editRollNo').value,
                class_name: document.getElementById('editClass').value,
                age: parseInt(document.getElementById('editAge').value)
            };
            
            try {
                const response = await fetch(`/api/users/students/${id}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(studentData)
                });
                
                if (response.ok) {
                    showAlert('Student updated successfully!', 'success');
                    closeModal();
                    await loadStudents(currentPage);
                } else {
                    const error = await response.json();
                    showAlert(JSON.stringify(error), 'error');
                }
            } catch (error) {
                console.error('Error updating student:', error);
                showAlert('Error updating student', 'error');
            }
        });
        
        // Delete student
        async function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                try {
                    const response = await fetch(`/api/users/students/${id}/`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showAlert('Student deleted successfully!', 'success');
                        await loadStudents(currentPage);
                    } else {
                        const error = await response.json();
                        showAlert(error.error || 'Error deleting student', 'error');
                    }
                } catch (error) {
                    console.error('Error deleting student:', error);
                    showAlert('Error deleting student', 'error');
                }
            }
        }
        
        // Close modal
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        // Show alert message
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }
        
        // Logout function
        async function logout() {
            try {
                await fetch('/api/users/logout/', { method: 'POST' });
                window.location.href = '/api/users/login-page/';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/api/users/login-page/';
            }
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeModal();
            }
        }
        
        // Initial load
        checkAuth();
        loadStudents();
    </script>
</body>
</html>
